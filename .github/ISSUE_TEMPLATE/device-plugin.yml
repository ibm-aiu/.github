name: Device Plugin Issue
description: Report an issue related to the device plugin component
title: "[Device Plugin]: "
labels: ["device-plugin"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a device plugin-related issue!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of the issue
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, logs, screenshots, or information here
      placeholder: Any additional information...
    validations:
      required: false
