name: Test Issue
description: Report an issue related to testing
title: "[Test]: "
labels: ["test"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a test-related issue!

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of the issue
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, logs, screenshots, or information here
      placeholder: Any additional information...
    validations:
      required: false
