name: Troubleshoot / Environment Setup
description: Get help with environment setup, configuration, or deployment issues
title: "[Troubleshoot]: "
labels: ["troubleshoot"]
body:
  - type: markdown
    attributes:
      value: |
        **Use this template for:** Environment setup issues, configuration problems, deployment questions, or help getting things working.
        
        **Not for:** Software bugs or defects in the code (use Bug Report instead).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of the issue
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, logs, screenshots, or information here
      placeholder: Any additional information...
    validations:
      required: false
