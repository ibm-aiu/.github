name: Bug Report
description: Report a software bug or defect in the code
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Use this template for:** Software bugs, crashes, errors, or unexpected behavior in the code.
        
        **Not for:** Environment setup issues, configuration problems, or deployment questions (use Troubleshoot instead).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of the bug
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, logs, screenshots, or information here
      placeholder: Any additional information...
    validations:
      required: false
